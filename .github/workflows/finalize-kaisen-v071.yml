name: Finalize Kaisen v0.8.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'finalize_trigger/**'
      - '.github/workflows/finalize-kaisen-v071.yml'
permissions:
  contents: read
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Python dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet beautifulsoup4 pillow
      - name: Restore validated v0.7.0 full pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=game-codex-shoujo-kaisen-pack-v0.7.0&per_page=100" --jq '.artifacts | map(select(.expired==false)) | sort_by(.created_at) | last | .id')
          test -n "$ART_ID"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > outer.zip
          mkdir outer work
          unzip -q outer.zip -d outer
          unzip -q outer/Game-Codex-Shoujo-Kaisen-pack-v0.7.0.zip -d work
          test -f work/codex/data/catalog.json
      - name: Normalize presentation data and rerank
        run: |
          python3 tools/postprocess_kaisen_catalog.py --out work/codex
      - name: Refresh Kaisen-native detail artwork
        run: |
          python3 tools/refresh_kaisen_art.py --out work/codex --workers 8
      - name: Validate data presentation boundaries
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('work/codex/data/catalog.json'))
          r=json.load(open('work/codex/kaisen-system-enrichment-report.json'))
          assert len(c['entities']) == 528
          assert r['heroes_ranked_with_subsystems'] == 528, r
          assert r['souls_logical_sets'] == 25, r
          assert r['martial_spirits'] == 64, r
          assert r['mounts'] == 14, r
          assert r['source_tiers_used_for_analysis'] is False
          assert c['analysis_policy']['status'] == 'experimental'
          broken=next(e for e in c['entities'] if e['canonical_name']=='Action failed')
          assert broken.get('display_name','').startswith('Wen Zhong'), broken
          abyss=next(e for e in c['entities'] if e['canonical_name']=='Abyss - The Last Apostle')
          lore=next(s for s in abyss['skills'] if s.get('name')=='Neverending Nightmare')
          assert lore.get('presentation_class') == 'source_note', lore
          sample=next(a for a in abyss['analysis'] if a.get('ranking_key')=='codex_analytical')
          assert sample.get('analysis_status') == 'experimental', sample
          print('DATA_PRESENTATION_OK',broken['display_name'],lore['presentation_class'])
          PY
      - name: Install branded mobile UI
        run: |
          cp android/app/src/main/assets/codex/index.html work/codex/index.html
          cp android/app/src/main/assets/codex/styles.css work/codex/styles.css
          cp android/app/src/main/assets/codex/core.js work/codex/core.js
          cp android/app/src/main/assets/codex/browser.js work/codex/browser.js
          cp android/app/src/main/assets/codex/detail.js work/codex/detail.js
          cp android/app/src/main/assets/codex/app.js work/codex/app.js
          node --check work/codex/core.js
          node --check work/codex/browser.js
          node --check work/codex/detail.js
          node --check work/codex/app.js
          python3 - <<'PY'
          import json, os
          c=json.load(open('work/codex/data/catalog.json'))
          assert c.get('games')
          for g in c['games']:
              icon=g.get('icon_path')
              assert icon and os.path.isfile(os.path.join('work/codex',icon)), (g.get('name'),icon)
          html=open('work/codex/index.html',encoding='utf-8').read()
          css=open('work/codex/styles.css',encoding='utf-8').read()
          browser=open('work/codex/browser.js',encoding='utf-8').read()
          assert all(x in html for x in ('homeScreen','gameScreen','detailScreen'))
          assert 'Data layers' not in html and 'Data layers' not in browser
          assert 'overflow-x:hidden' in css
          assert 'character-card' in html
          assert 'rankline' not in html
          print('BRANDED_UI_OK',[(g['name'],g['icon_path']) for g in c['games']])
          PY
      - name: Package full portable pack
        run: |
          cd work
          zip -qr "$GITHUB_WORKSPACE/Game-Codex-Shoujo-Kaisen-pack-v0.8.0.zip" codex
          cd "$GITHUB_WORKSPACE"
          sha256sum Game-Codex-Shoujo-Kaisen-pack-v0.8.0.zip > Game-Codex-Shoujo-Kaisen-pack-v0.8.0.sha256
      - name: Prepare Android offline assets
        run: |
          rm -rf android/app/src/main/assets/codex
          cp -a work/codex android/app/src/main/assets/codex
          rm -rf android/app/src/main/assets/codex/raw android/app/src/main/assets/codex/research
          rm -f android/app/src/main/assets/codex/data/catalog.json
          rm -f android/app/src/main/assets/codex/identity-match-report.json
          rm -f android/app/src/main/assets/codex/source-sync-report.json
          rm -f android/app/src/main/assets/codex/kaisen-system-enrichment-report.json
          rm -f android/app/src/main/assets/codex/kaisen-art-refresh-report.json
          sed -E -i "s/versionCode [0-9]+/versionCode 20/" android/app/build.gradle
          sed -E -i "s/versionName '[^']+'/versionName '0.8.0'/" android/app/build.gradle
      - name: Build APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Game-Codex-Shoujo-Kaisen-v0.8.0.apk
          sha256sum Game-Codex-Shoujo-Kaisen-v0.8.0.apk > Game-Codex-Shoujo-Kaisen-v0.8.0.sha256
          ls -lh Game-Codex-Shoujo-Kaisen-v0.8.0.apk Game-Codex-Shoujo-Kaisen-pack-v0.8.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: game-codex-shoujo-kaisen-apk-v0.8.0
          path: |
            Game-Codex-Shoujo-Kaisen-v0.8.0.apk
            Game-Codex-Shoujo-Kaisen-v0.8.0.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: game-codex-shoujo-kaisen-pack-v0.8.0
          path: |
            Game-Codex-Shoujo-Kaisen-pack-v0.8.0.zip
            Game-Codex-Shoujo-Kaisen-pack-v0.8.0.sha256
          if-no-files-found: error
