name: Build Android Game Codex

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build current Shoujo Kaisen offline bootstrap pack
        run: |
          rm -rf android/app/src/main/assets/codex/assets
          mkdir -p android/app/src/main/assets/codex/assets android/app/src/main/assets/codex/data
          python3 tools/build_shoujo_pack.py --out android/app/src/main/assets/codex
          cat android/app/src/main/assets/codex/source-sync-report.json

      - name: Package portable offline pack
        run: |
          cd android/app/src/main/assets
          zip -qr "$GITHUB_WORKSPACE/Game-Codex-Shoujo-Kaisen-pack-v0.5.0.zip" codex
          cd "$GITHUB_WORKSPACE"
          sha256sum Game-Codex-Shoujo-Kaisen-pack-v0.5.0.zip > Game-Codex-Shoujo-Kaisen-pack-v0.5.0.sha256

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Game-Codex-Shoujo-Kaisen-v0.5.0.apk
          sha256sum Game-Codex-Shoujo-Kaisen-v0.5.0.apk > Game-Codex-Shoujo-Kaisen-v0.5.0.sha256
          ls -lh Game-Codex-Shoujo-Kaisen-v0.5.0.apk Game-Codex-Shoujo-Kaisen-pack-v0.5.0.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-codex-shoujo-kaisen-apk-v0.5.0
          path: |
            Game-Codex-Shoujo-Kaisen-v0.5.0.apk
            Game-Codex-Shoujo-Kaisen-v0.5.0.sha256
          if-no-files-found: error

      - name: Upload portable pack
        uses: actions/upload-artifact@v4
        with:
          name: game-codex-shoujo-kaisen-pack-v0.5.0
          path: |
            Game-Codex-Shoujo-Kaisen-pack-v0.5.0.zip
            Game-Codex-Shoujo-Kaisen-pack-v0.5.0.sha256
          if-no-files-found: error
