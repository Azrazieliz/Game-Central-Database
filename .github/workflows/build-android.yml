name: Build Android Game Codex

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install data builder dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pillow pypinyin pykakasi numpy opencv-python-headless

      - name: Inspect Kaisen source structure
        run: python3 tools/inspect_kaisen_structure.py

      - name: Restore validated Kaisen catalogue baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=game-codex-shoujo-kaisen-pack-v0.5.0&per_page=100" --jq '.artifacts | map(select(.expired==false)) | sort_by(.created_at) | last | .id')
          test -n "$ART_ID"
          gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > baseline-artifact.zip
          mkdir -p baseline-artifact baseline-pack
          unzip -q baseline-artifact.zip -d baseline-artifact
          unzip -q baseline-artifact/Game-Codex-Shoujo-Kaisen-pack-v0.5.0.zip -d baseline-pack
          test -f baseline-pack/codex/data/catalog.json

      - name: Build current Shoujo Kaisen analyzed offline pack
        run: |
          rm -rf android/app/src/main/assets/codex/assets android/app/src/main/assets/codex/raw
          mkdir -p android/app/src/main/assets/codex/assets android/app/src/main/assets/codex/data
          python3 tools/build_shoujo_data.py --out android/app/src/main/assets/codex --workers 8 --kaisen-baseline baseline-pack/codex
          cat android/app/src/main/assets/codex/source-sync-report.json

      - name: Package portable offline pack
        run: |
          cd android/app/src/main/assets
          zip -qr "$GITHUB_WORKSPACE/Game-Codex-Shoujo-Kaisen-pack-v0.6.3.zip" codex
          cd "$GITHUB_WORKSPACE"
          sha256sum Game-Codex-Shoujo-Kaisen-pack-v0.6.3.zip > Game-Codex-Shoujo-Kaisen-pack-v0.6.3.sha256

      - name: Trim pack-builder files from APK payload
        run: |
          rm -rf android/app/src/main/assets/codex/raw android/app/src/main/assets/codex/research
          rm -f android/app/src/main/assets/codex/data/catalog.json
          rm -f android/app/src/main/assets/codex/identity-match-report.json
          rm -f android/app/src/main/assets/codex/source-sync-report.json

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Game-Codex-Shoujo-Kaisen-v0.6.3.apk
          sha256sum Game-Codex-Shoujo-Kaisen-v0.6.3.apk > Game-Codex-Shoujo-Kaisen-v0.6.3.sha256
          ls -lh Game-Codex-Shoujo-Kaisen-v0.6.3.apk Game-Codex-Shoujo-Kaisen-pack-v0.6.3.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-codex-shoujo-kaisen-apk-v0.6.3
          path: |
            Game-Codex-Shoujo-Kaisen-v0.6.3.apk
            Game-Codex-Shoujo-Kaisen-v0.6.3.sha256
          if-no-files-found: error

      - name: Upload portable pack
        uses: actions/upload-artifact@v4
        with:
          name: game-codex-shoujo-kaisen-pack-v0.6.3
          path: |
            Game-Codex-Shoujo-Kaisen-pack-v0.6.3.zip
            Game-Codex-Shoujo-Kaisen-pack-v0.6.3.sha256
          if-no-files-found: error
