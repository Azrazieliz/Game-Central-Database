<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#070a10" />
  <title>Game Codex</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="homeScreen" class="screen"></section>
    <section id="gameScreen" class="screen hidden"></section>
    <section id="detailScreen" class="screen hidden"></section>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
  <section id="filterSheet" class="bottom-sheet hidden" aria-modal="true"></section>
  <section id="settingsSheet" class="bottom-sheet hidden" aria-modal="true"></section>

  <template id="characterCardTemplate">
    <button class="character-card">
      <div class="character-art-wrap">
        <img class="character-art" loading="lazy" />
        <div class="character-art-placeholder">NO ART</div>
        <span class="rarity-badge"></span>
      </div>
      <div class="character-card-copy">
        <strong class="character-name"></strong>
        <span class="character-meta"></span>
      </div>
    </button>
  </template>

  <template id="subsystemCardTemplate">
    <button class="subsystem-card">
      <img class="subsystem-art" loading="lazy" />
      <div class="subsystem-copy">
        <strong class="subsystem-name"></strong>
        <span class="subsystem-meta"></span>
      </div>
    </button>
  </template>

  <script src="data/catalog.js"></script>
  <script src="core.js"></script>
  <script src="browser.js"></script>
  <script src="detail.js"></script>
  <script src="app.js"></script>
</body>
</html>
